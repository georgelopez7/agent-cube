components:
  schemas:
    ApplyRubiksCubeRotationInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/ApplyRubiksCubeRotationInputBody.json
          format: uri
          readOnly: true
          type: string
        rotation:
          type: string
      required:
        - rotation
      type: object
    ApplyRubiksCubeRotationResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/ApplyRubiksCubeRotationResponseBody.json
          format: uri
          readOnly: true
          type: string
        cube:
          $ref: "#/components/schemas/RubiksCube"
      required:
        - cube
      type: object
    CreateRubiksCubeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/CreateRubiksCubeInputBody.json
          format: uri
          readOnly: true
          type: string
        llm:
          $ref: "#/components/schemas/LLM"
        scramble:
          format: int64
          minimum: 1
          type: integer
      required:
        - llm
      type: object
    CreateRubiksCubeResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/CreateRubiksCubeResponseBody.json
          format: uri
          readOnly: true
          type: string
        cube:
          $ref: "#/components/schemas/RubiksCube"
      required:
        - cube
      type: object
    Cube:
      additionalProperties: false
      properties:
        centers:
          additionalProperties:
            $ref: "#/components/schemas/Cubie"
          type: object
        corners:
          additionalProperties:
            $ref: "#/components/schemas/Cubie"
          type: object
        edges:
          additionalProperties:
            $ref: "#/components/schemas/Cubie"
          type: object
        rotations:
          items:
            $ref: "#/components/schemas/CubeRotation"
          type:
            - array
            - "null"
      required:
        - centers
        - edges
        - corners
        - rotations
      type: object
    CubeRotation:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        from_scramble:
          type: boolean
        index:
          format: int64
          type: integer
        rotation:
          type: string
      required:
        - rotation
        - index
        - from_scramble
        - created_at
      type: object
    Cubie:
      additionalProperties: false
      properties:
        stickers:
          additionalProperties:
            type: string
          type: object
      required:
        - stickers
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GetAIModelsResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GetAIModelsResponseBody.json
          format: uri
          readOnly: true
          type: string
        models:
          items:
            $ref: "#/components/schemas/LLM"
          type:
            - array
            - "null"
      required:
        - models
      type: object
    GetAllRubiksCubesResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GetAllRubiksCubesResponseBody.json
          format: uri
          readOnly: true
          type: string
        cubes:
          items:
            $ref: "#/components/schemas/RubiksCube"
          type:
            - array
            - "null"
      required:
        - cubes
      type: object
    GetRubiksCubeByIDResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GetRubiksCubeByIDResponseBody.json
          format: uri
          readOnly: true
          type: string
        cube:
          $ref: "#/components/schemas/RubiksCube"
      required:
        - cube
      type: object
    GetSolvedCubeResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/GetSolvedCubeResponseBody.json
          format: uri
          readOnly: true
          type: string
        cube:
          $ref: "#/components/schemas/Cube"
      required:
        - cube
      type: object
    InvokeRubiksCubeAgentResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/InvokeRubiksCubeAgentResponseBody.json
          format: uri
          readOnly: true
          type: string
        message:
          type: string
      required:
        - message
      type: object
    IsRubiksCubeSolvedResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/IsRubiksCubeSolvedResponseBody.json
          format: uri
          readOnly: true
          type: string
        solved:
          type: boolean
      required:
        - solved
      type: object
    LLM:
      additionalProperties: false
      properties:
        model:
          type: string
        provider:
          type: string
      required:
        - provider
        - model
      type: object
    RubiksCube:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        cube:
          $ref: "#/components/schemas/Cube"
        id:
          type: string
        llm:
          $ref: "#/components/schemas/LLM"
        status:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - llm
        - status
        - cube
        - created_at
        - updated_at
      type: object
    UpdateRubiksCubeInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/UpdateRubiksCubeInputBody.json
          format: uri
          readOnly: true
          type: string
        cube:
          $ref: "#/components/schemas/Cube"
        llm:
          $ref: "#/components/schemas/LLM"
        status:
          type: string
      required:
        - llm
        - status
        - cube
      type: object
    UpdateRubiksCubeResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/UpdateRubiksCubeResponseBody.json
          format: uri
          readOnly: true
          type: string
        cube:
          $ref: "#/components/schemas/RubiksCube"
      required:
        - cube
      type: object
    UpdateRubiksCubeStatusInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/UpdateRubiksCubeStatusInputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    UpdateRubiksCubeStatusResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/schemas/UpdateRubiksCubeStatusResponseBody.json
          format: uri
          readOnly: true
          type: string
        cube:
          $ref: "#/components/schemas/RubiksCube"
      required:
        - cube
      type: object
info:
  title: Agent Cube API
  version: v1
openapi: 3.1.0
paths:
  /api/v1/ai/models:
    get:
      description: Returns the list of available LLMs
      operationId: get-ai-models
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAIModelsResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List AI models
      tags:
        - ai
  /api/v1/rubiks-cubes:
    get:
      description: Lists rubiks cubes with an optional limit
      operationId: get-all-rubiks-cubes
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 10
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllRubiksCubesResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List rubiks cubes
      tags:
        - rubiks-cubes
    post:
      description: Creates a new rubiks cube configured for a specific LLM
      operationId: create-rubiks-cube
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRubiksCubeInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRubiksCubeResponseBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a rubiks cube
      tags:
        - rubiks-cubes
  /api/v1/rubiks-cubes/{id}:
    get:
      description: Retrieves a rubiks cube by its hex ID
      operationId: get-rubiks-cube-by-id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRubiksCubeByIDResponseBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a rubiks cube by ID
      tags:
        - rubiks-cubes
    put:
      description: Updates an existing rubiks cube by its hex ID
      operationId: update-rubiks-cube
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRubiksCubeInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRubiksCubeResponseBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Update a rubiks cube
      tags:
        - rubiks-cubes
  /api/v1/rubiks-cubes/{id}/agents/invoke:
    post:
      description: Invokes the agent for the rubiks cube with the given hex ID
      operationId: invoke-rubiks-cube-agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeRubiksCubeAgentResponseBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Invoke the Rubik's Cube agent
      tags:
        - rubiks-cubes
  /api/v1/rubiks-cubes/{id}/rotations:
    post:
      description: Applies a rotation to an existing rubiks cube by its hex ID
      operationId: apply-rubiks-cube-rotation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyRubiksCubeRotationInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyRubiksCubeRotationResponseBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Apply a rotation to a rubiks cube
      tags:
        - rubiks-cubes
  /api/v1/rubiks-cubes/{id}/solved:
    get:
      description: Returns whether the rubiks cube with the given hex ID is solved
      operationId: is-rubiks-cube-solved
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IsRubiksCubeSolvedResponseBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Check if a rubiks cube is solved
      tags:
        - rubiks-cubes
  /api/v1/rubiks-cubes/{id}/status:
    patch:
      description: Updates only the status of an existing rubiks cube by its hex ID
      operationId: update-rubiks-cube-status
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRubiksCubeStatusInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateRubiksCubeStatusResponseBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Update the status of a rubiks cube
      tags:
        - rubiks-cubes
  /api/v1/solved-cube:
    get:
      description: Returns the example solved cube
      operationId: get-solved-cube
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSolvedCubeResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the example solved cube
      tags:
        - rubiks-cubes
  /api/v1/ws:
    get:
      description: Upgrades the HTTP connection to a WebSocket for real-time updates
      operationId: websocket-connection
      responses:
        "101":
          description: Switching Protocols to WebSocket
      summary: WebSocket connection
      tags:
        - websocket
servers:
  - url: http://localhost:8080

