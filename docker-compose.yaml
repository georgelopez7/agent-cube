services:
  app:
    build:
      context: ./cmd/agentcube-app
      dockerfile: Dockerfile
      args:
        VITE_WEBSOCKET_URL: ws://localhost:8080/api/v1/ws
        VITE_SITE_URL: http://localhost:3000
        VITE_GITHUB_URL: https://github.com/georgelopez7/agent-cube
        VITE_X_URL: https://x.com/xgeloop
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: ./cmd/agentcube-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: dev
      PORT: 8080
      MONGODB_URI: mongodb://user:password@mongo:27017/agentcube-db?authSource=admin
      MONGODB_DB: agentcube-db
      WEBSOCKET_ALLOWED_ORIGINS: http://app:3000,http://localhost:3000,http://localhost:3001,http://localhost:3002
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set in .env}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_HTTP_REFERRER: http://localhost:3001
      OPENROUTER_X_TITLE: Agent Cube
      OTEL_SERVICE_NAME: agentcube-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://phoenix:6006/v1/traces
    depends_on:
      mongo:
        condition: service_healthy
      phoenix:
        condition: service_started

  mongo:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=user
      - MONGO_INITDB_ROOT_PASSWORD=password
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "user",
          "--password",
          "password",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.runCommand({ ping: 1 })",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  phoenix:
    image: arizephoenix/phoenix:version-20.17.0
    restart: always
    depends_on:
      phoenix-db:
        condition: service_healthy
    ports:
      - "6006:6006"
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:phoenix@phoenix-db:5432/phoenix

  phoenix-db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix
      POSTGRES_DB: phoenix
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - phoenix_postgres_data:/var/lib/postgresql/data

volumes:
  phoenix_postgres_data:
